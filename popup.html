<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; padding: 10px 14px 12px; font-family: "Hiragino Kaku Gothic ProN", sans-serif; background: #0f171e; color: #fff; }
  #start { width: 100%; padding: 9px; font-size: 14px; font-weight: 700; border: none; border-radius: 8px; background: #0578FF; color: #fff; cursor: pointer; }
  #start:hover { background: #2E8BFF; }
  #note { font-size: 12px; color: #c7d5e0; margin: 8px 0 0; }
  #note:empty { display: none; }
  #surface-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: #c7d5e0; }
  #surface-row label { white-space: nowrap; }
  #surface { flex: 1; min-width: 0; background: #22303c; color: #fff; border: 1px solid #3a4a58; border-radius: 6px; padding: 4px; font-size: 12px; }
  #surface-note { font-size: 11px; color: #9db4c4; margin: 6px 0 0; }
  #surface-note:empty { display: none; }
  h2 { font-size: 13px; margin: 12px 0 4px; color: #7ee2a8; }
  #results > h2:first-of-type { margin-top: 8px; }
  h2.sub { color: #9db4c4; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 5px 0; border-top: 1px solid #22303c; }
  li a { color: #fff; text-decoration: none; font-weight: 600; font-size: 13px; }
  li a:hover { text-decoration: underline; }
  .cta { display: block; color: #9db4c4; font-size: 12px; }
  .empty { font-size: 12px; color: #9db4c4; }
  #meta { font-size: 11px; color: #71879a; margin-top: 10px; }
  #diag-copy { width: 100%; padding: 7px; margin-top: 10px; font-size: 12px; font-weight: 700; border: 1px solid #3a4a58; border-radius: 8px; background: #22303c; color: #c7d5e0; cursor: pointer; }
  #diag-copy:hover { background: #2b3d4c; }
  #brand { font-size: 11px; color: #71879a; margin-top: 12px; white-space: nowrap; }
</style>
</head>
<body>
  <button id="start" type="button">ウォッチリストをチェック</button>
  <p id="note"></p>
  <div id="results"></div>
  <p id="meta"></p>
  <div id="fliplog"></div>
  <button id="diag-copy" type="button">診断情報をコピー</button>
  <div id="brand">▶Prime Video ウォッチリスト新着チェッカー</div>
  <div id="surface-row">
    <label id="surface-label" for="surface">開くウォッチリスト</label>
    <select id="surface">
      <option value="auto">自動（前回と同じ）</option>
      <option value="cojp">amazon.co.jp</option>
      <option value="com">amazon.com</option>
      <option value="pv">primevideo.com</option>
    </select>
  </div>
  <p id="surface-note"></p>
  <script src="popup.js"></script>
</body>
</html>
