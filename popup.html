<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; padding: 12px 14px; font-family: "Hiragino Kaku Gothic ProN", sans-serif; background: #0f171e; color: #fff; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  #start { width: 100%; padding: 9px; font-size: 14px; font-weight: 700; border: none; border-radius: 8px; background: #00a8e1; color: #fff; cursor: pointer; }
  #start:hover { background: #0db3f0; }
  #note { font-size: 12px; color: #c7d5e0; margin: 8px 0 0; min-height: 16px; }
  h2 { font-size: 13px; margin: 14px 0 4px; color: #7ee2a8; }
  h2.sub { color: #9db4c4; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 5px 0; border-top: 1px solid #22303c; }
  li a { color: #fff; text-decoration: none; font-weight: 600; font-size: 13px; }
  li a:hover { text-decoration: underline; }
  .cta { display: block; color: #9db4c4; font-size: 12px; }
  .empty { font-size: 12px; color: #9db4c4; }
  #meta { font-size: 11px; color: #71879a; margin-top: 10px; }
</style>
</head>
<body>
  <h1>Amazon Prime Video 未視聴ウォッチリストチェッカー</h1>
  <button id="start" type="button">ウォッチリストをチェック</button>
  <p id="note"></p>
  <div id="results"></div>
  <p id="meta"></p>
  <script src="popup.js"></script>
</body>
</html>
